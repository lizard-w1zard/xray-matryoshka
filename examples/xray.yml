---

# ==========================================
# Entry Node IP
# ==========================================
xray_entry_host: "1.2.3.4"   # Public IP of your Entry node

# ==========================================
# SNI / Dest Domains for REALITY masking
# Must support TLS 1.3 and HTTP/2
# ==========================================
xray_entry_dest: "www.rambler.ru"       # Masking domain for Entry node (RU, low latency)
xray_transit_dest: "www.cloudflare.com" # Masking domain for Transit node

# ==========================================
# Client UUIDs for VLESS authentication
# Generate: uuidgen
# ==========================================
xray_entry_uuid: badb5131-9798-46bc-be7a-152905598a59
xray_transit_uuid: 8500c2ce-645d-4731-baba-65c4bddb1d66
xray_exit_uuid: 804fb5a7-1027-4dd4-96e2-faa3b35ac068

# ==========================================
# REALITY Key Pairs (x25519)
# Generate: docker run --rm teddysun/xray xray x25519
# ==========================================
xray_entry_private_key: ZZq4OAdut0Rp3wd09LhUMMwNwfeQx3LtiTX6p9jD4JF
xray_entry_public_key: a9nBay8Zqs2C0YLNqs1a9yLmf6qzKgiiRbPXMpFpC8H

xray_transit_private_key: HR096EOwQoyoErtHo0UccvNHHH8ZYVyGSY03WK6aURF
xray_transit_public_key: tj7bwWQc4tQwc5iUM0yFayeOiPmkD2VvPNK9MP7Qqgm

# ==========================================
# REALITY Short IDs
# Generate: openssl rand -hex 8
# ==========================================
xray_entry_short_id: ce3b334702d898ff
xray_transit_short_id: a4c0add371567212

# ==========================================
# Client subscription link (auto-assembled from variables above)
# Pushed to GitHub Gist on every deploy — do not edit manually
# ==========================================
xray_entry_vless_link: "vless://{{ xray_entry_uuid }}@{{ xray_entry_host }}:443?encryption=none&type=grpc&serviceName=grpc&security=reality&pbk={{ xray_entry_public_key }}&fp=chrome&sni={{ xray_entry_dest }}&sid={{ xray_entry_short_id }}#Matryoshka"

# ==========================================
# Cloudflare WARP Credentials
# Used on Exit node for selective routing
# Generate: wgcf register && wgcf generate (values from wgcf-profile.conf)
# ==========================================

# WireGuard Private Key (32-byte base64)
xray_warp_private_key: "iexuC>aeBie3aiVee2eenowahKici!edaim8aekai8ee"

# Internal IPv4 assigned by Cloudflare (usually 172.16.0.2/32)
xray_warp_ipv4: "172.16.0.2/32"

# Unique IPv6 assigned to your WARP account
xray_warp_ipv6: "2606:4700:110:84ef:19b2:940a:612f:98ab/128"

# Client ID bytes for Cloudflare routing (default: [0, 0, 0] or decoded client_id from API)
xray_warp_reserved: "[0, 0, 0]"

# List of domains/categories routed via WARP (supports domain:, full:, geosite:)
xray_warp_domains:
  - "domain:openai.com"
  - "domain:claude.ai"

# ==========================================
# GitHub Gist Subscription
# This file is gitignored — never commit real values
# ==========================================

# GitHub Personal Access Token with `gist` scope only
# Generate: GitHub → Settings → Developer settings → Personal access tokens → Fine-grained
github_gist_token: "github_pat_XXXXXXXXXXXXXXXXXXXXXXXX"

# Gist ID from the URL: gist.github.com/{user}/{ID}
# Create a secret gist manually at gist.github.com with a file named sub.txt
# Generate: openssl rand -hex 32 (use as a throwaway initial content)
github_gist_id: "a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4"

# Your GitHub username
github_gist_user: "your-username"
